<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>DD Lager – QR-Scanner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #scanner {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #rahmen {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 420px);
      height: min(78vw, 420px);
      transform: translate(-50%, -50%);
      border: 4px solid #fff;
      border-radius: 18px;
      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.45);
    }

    #status {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 35px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    #fehler {
      display: none;
      position: absolute;
      left: 20px;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      padding: 22px;
      border-radius: 14px;
      background: #fff;
      color: #222;
      text-align: center;
      font-size: 18px;
    }

    #fehler button {
      margin-top: 15px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

  </style>

</head>

<body>

  <div id="scanner">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <div id="overlay">

      <div id="rahmen"></div>

      <div id="status">
        Kamera wird gestartet …
      </div>

    </div>

    <div id="fehler">

      <div>
        Der Kamerazugriff konnte nicht gestartet werden.
      </div>

      <div style="margin-top:10px;">
        Bitte den Kamerazugriff erlauben und anschließend
        die Seite neu laden.
      </div>

      <button
        type="button"
        onclick="location.reload()"
      >
        Erneut versuchen
      </button>

    </div>

  </div>

<script>

  let stream = null;
  let scannerAktiv = false;
  let bereitsErkannt = false;

  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const fehler = document.getElementById("fehler");


  async function scannerStarten() {

    try {

      status.textContent =
        "Kamera wird gestartet …";


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "getUserMedia wird nicht unterstützt."
        );

      }


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


      video.srcObject = stream;

      await video.play();

      scannerAktiv = true;

      status.textContent =
        "QR-Code vor die Kamera halten …";

      qrErkennungStarten();

    }

    catch (error) {

      console.error(
        "Kamera Fehler:",
        error
      );

      status.style.display = "none";
      fehler.style.display = "block";

    }

  }


  function qrErkennungStarten() {

    if (!("BarcodeDetector" in window)) {

      status.textContent =
        "QR-Erkennung wird auf diesem Browser nicht unterstützt.";

      return;

    }


    let detector;

    try {

      detector =
        new BarcodeDetector({
          formats: ["qr_code"]
        });

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "QR-Erkennung konnte nicht gestartet werden.";

      return;

    }


    async function scannen() {

      if (
        !scannerAktiv ||
        bereitsErkannt
      ) {

        return;

      }


      if (
        video.readyState < 2 ||
        video.videoWidth === 0
      ) {

        requestAnimationFrame(scannen);

        return;

      }


      try {

        const codes =
          await detector.detect(video);


        if (
          codes &&
          codes.length > 0
        ) {

          const text =
            codes[0].rawValue;


          if (
            text &&
            text.trim()
          ) {

            bereitsErkannt = true;

            status.textContent =
              "QR-Code erkannt …";

            qrCodeGefunden(
              text.trim()
            );

            return;

          }

        }

      }

      catch (error) {

        console.error(
          "QR-Erkennung:",
          error
        );

      }


      requestAnimationFrame(scannen);

    }


    requestAnimationFrame(scannen);

  }


  function qrCodeGefunden(text) {

    scannerAktiv = false;


    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }


    /*
     * Der Scanner gibt den erkannten Wert
     * ausschließlich an die DD Lager-App zurück.
     *
     * Der QR-Inhalt wird NICHT als URL geöffnet.
     */

    let rueckgabeErfolgreich = false;


    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(

          {
            typ: "DD_LAGER_QR_SCAN",
            text: text
          },

          "*"

        );

        rueckgabeErfolgreich = true;


        status.textContent =
          "✓ Lagerplatz erkannt: " +
          text +
          " – zurück zur Lager-App …";


        setTimeout(

          function() {

            try {

              window.close();

            }

            catch (error) {

              console.error(error);

            }

          },

          700

        );

        return;

      }

    }

    catch (error) {

      console.error(
        "Rückgabe an Lager-App fehlgeschlagen:",
        error
      );

    }


    /*
     * Falls der Scanner direkt geöffnet wurde
     * und deshalb kein opener vorhanden ist,
     * wird der QR-Inhalt NICHT geöffnet.
     */

    if (!rueckgabeErfolgreich) {

      status.textContent =
        "✓ QR-Code erkannt: " +
        text +
        " – bitte zur Lager-App zurückkehren.";

    }

  }


  window.addEventListener(
    "beforeunload",
    function() {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }

    }
  );


  window.addEventListener(
    "load",
    function() {

      scannerStarten();

    }
  );

</script>

</body>
</html>
