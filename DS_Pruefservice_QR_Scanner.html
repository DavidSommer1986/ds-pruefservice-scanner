<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QR-Code Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:14px}
.box{width:100%;max-width:650px;margin:0 auto;text-align:center}
h1{font-size:23px;margin:8px 0 6px}
p{margin:0 0 10px;font-size:14px;line-height:1.45;color:#d0d0d0}
.hint{display:inline-block;margin:2px 0 10px;padding:8px 12px;border-radius:9px;background:#252525;font-size:13px}
.camera{position:relative;width:100%;max-width:620px;margin:12px auto 8px;background:#000;border-radius:16px;overflow:hidden}
#video{display:block;width:100%;height:auto;min-height:320px;object-fit:cover}
#scanCanvas{display:none}
.frame{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:10px;pointer-events:none}
#status{min-height:22px;margin:8px 0;font-weight:bold;font-size:13px;line-height:1.25}
button{width:100%;border:0;border-radius:9px;padding:11px;margin-top:6px;font-size:14px;font-weight:bold}
#again{background:#f28c00;color:#fff}
#close{background:#555;color:#fff}
.hidden{display:none}
</style>
</head>

<body>
<main class="box">
<h1>📷 QR-Code scannen</h1>
<p>Halte <strong>einen einzelnen QR-Code</strong> möglichst nah und gerade vor die Kamera.</p>
<div class="hint">Der QR-Code sollte möglichst groß im weißen Rahmen stehen.</div>

<div class="camera">
  <video id="video" playsinline autoplay muted></video>
  <div class="frame"></div>
</div>

<canvas id="scanCanvas"></canvas>
<div id="status">Kamera wird gestartet …</div>

<button id="again" class="hidden">📷 Erneut scannen</button>
<button id="close">Fenster schließen</button>
</main>

<script>
let stream = null;
let scanning = false;
let sent = false;
let animationId = null;
let lastScan = 0;

const token = new URLSearchParams(location.search).get("token") || "";
const video = document.getElementById("video");
const canvas = document.getElementById("scanCanvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});
const status = document.getElementById("status");
const again = document.getElementById("again");

function setStatus(t){status.textContent=t;}

async function stopCamera(){
  scanning=false;
  if(animationId) cancelAnimationFrame(animationId);
  animationId=null;
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
}

function sendResult(value){
  if(sent) return;
  const text=String(value||"").trim();
  if(!text) return;

  sent=true;
  scanning=false;

  let anzeige = text;

  /*
   * Falls ein alter QR-Code noch die komplette Apps-Script-URL
   * enthält, zeigen wir trotzdem nur die Inventarnummer an.
   * So wird der Scanner nicht durch die lange URL riesig.
   */
  try {
    const url = new URL(text);
    const inventar = url.searchParams.get("inventar");
    if (inventar) anzeige = inventar;
  } catch(e) {}

  if(window.opener && !window.opener.closed){
    window.opener.postMessage({
      type:"DS_PRUEFSERVICE_QR_SCAN",
      value:text,
      token:token
    },"*");

    setStatus("✓ QR-Code erkannt: " + anzeige);
    setTimeout(()=>window.close(),500);
  }else{
    setStatus("✓ QR-Code erkannt: " + anzeige);
    again.classList.remove("hidden");
    sent=false;
  }
}

async function tryBarcodeDetector(){
  if(!("BarcodeDetector" in window)) return false;

  try{
    const formats=await BarcodeDetector.getSupportedFormats();
    if(!formats.includes("qr_code")) return false;

    const detector=new BarcodeDetector({formats:["qr_code"]});

    async function detect(){
      if(!scanning || sent) return;

      try{
        const codes=await detector.detect(video);
        if(codes && codes.length && codes[0].rawValue){
          sendResult(codes[0].rawValue);
          return;
        }
      }catch(e){}

      if(scanning) requestAnimationFrame(detect);
    }

    requestAnimationFrame(detect);
    return true;
  }catch(e){
    return false;
  }
}

function scanWithJsQr(now){
  if(!scanning || sent) return;

  /*
   * Nicht bei jedem Videoframe rechnen.
   * 12–15 Scans/Sekunde reichen und lassen den Browser
   * genug Zeit für die Kamera.
   */
  if(now-lastScan<70){
    animationId=requestAnimationFrame(scanWithJsQr);
    return;
  }
  lastScan=now;

  if(video.readyState < 2 || !video.videoWidth){
    animationId=requestAnimationFrame(scanWithJsQr);
    return;
  }

  const w=video.videoWidth;
  const h=video.videoHeight;

  /*
   * Wir lesen das komplette Kamerabild in voller Auflösung.
   * Das ist absichtlich NICHT auf den sichtbaren Rahmen begrenzt.
   * Dadurch kann auch ein kleiner QR-Code erkannt werden.
   */
  canvas.width=w;
  canvas.height=h;
  ctx.drawImage(video,0,0,w,h);

  try{
    const image=ctx.getImageData(0,0,w,h);
    const code=jsQR(image.data,image.width,image.height,{
      inversionAttempts:"attemptBoth"
    });

    if(code && code.data){
      sendResult(code.data);
      return;
    }
  }catch(e){}

  if(scanning) animationId=requestAnimationFrame(scanWithJsQr);
}

async function startCamera(){
  await stopCamera();
  sent=false;
  again.classList.add("hidden");

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus("Dieser Browser unterstützt den Kamerazugriff nicht.");
    again.classList.remove("hidden");
    return;
  }

  setStatus("Kamera wird gestartet …");

  try{
    /*
     * Hohe Auflösung ist hier entscheidend, weil deine QR-Codes
     * auf dem 5 x 2,5 cm Etikett relativ klein sind.
     */
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920,min:1280},
        height:{ideal:1080,min:720},
        frameRate:{ideal:30,max:30}
      }
    });

    video.srcObject=stream;
    await video.play();

    const track=stream.getVideoTracks()[0];

    /*
     * Auf vielen Android-Geräten lässt sich der kontinuierliche
     * Autofokus nach dem Start zusätzlich setzen.
     */
    try{
      const caps=track.getCapabilities ? track.getCapabilities() : {};
      if(caps.focusMode && caps.focusMode.includes("continuous")){
        await track.applyConstraints({
          advanced:[{focusMode:"continuous"}]
        });
      }
    }catch(e){}

    scanning=true;

    setStatus("✓ Kamera läuft – QR-Code nah vor die Kamera halten.");

    /*
     * Native BarcodeDetector parallel nutzen, wenn Android/Chrome
     * ihn unterstützt. Zusätzlich läuft jsQR als Fallback.
     */
    await tryBarcodeDetector();
    animationId=requestAnimationFrame(scanWithJsQr);

  }catch(e){
    console.error(e);

    let msg="Kamera konnte nicht gestartet werden.";

    if(e && e.name==="NotAllowedError"){
      msg="Kamerazugriff wurde blockiert. Bitte die Kamera-Berechtigung erlauben.";
    }else if(e && e.name==="NotFoundError"){
      msg="Keine Kamera gefunden.";
    }else if(e && e.message){
      msg="Kamera konnte nicht gestartet werden: "+e.message;
    }

    setStatus(msg);
    again.classList.remove("hidden");
  }
}

again.onclick=()=>startCamera();

document.getElementById("close").onclick=async()=>{
  await stopCamera();
  window.close();
};

window.addEventListener("pagehide",()=>stopCamera());

startCamera();
</script>
</body>
</html>
