<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QR-Code Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:14px;
}

.box{
  width:100%;
  max-width:620px;
  margin:0 auto;
  text-align:center;
}

h1{
  font-size:23px;
  margin:8px 0 6px;
}

p{
  margin:0 0 10px;
  font-size:14px;
  line-height:1.45;
  color:#d0d0d0;
}

.hint{
  display:inline-block;
  margin:2px 0 10px;
  padding:8px 12px;
  border-radius:9px;
  background:#252525;
  color:#fff;
  font-size:13px;
}

#reader{
  width:100%;
  max-width:590px;
  margin:12px auto 8px;
  border-radius:16px;
  overflow:hidden;
  background:#000;
}

/* html5-qrcode erzeugt das Video selbst */
#reader video{
  width:100% !important;
  height:auto !important;
  min-height:320px;
  object-fit:cover !important;
}

#status{
  min-height:25px;
  margin:12px 0;
  font-weight:bold;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  margin-top:8px;
  font-size:16px;
  font-weight:bold;
}

#again{
  background:#f28c00;
  color:#fff;
}

#close{
  background:#555;
  color:#fff;
}

.hidden{
  display:none;
}
</style>
</head>

<body>
<main class="box">

  <h1>📷 QR-Code scannen</h1>

  <p>
    Halte <strong>einen einzelnen QR-Code</strong> möglichst nah und gerade
    vor die Kamera.
  </p>

  <div class="hint">
    Tipp: QR-Code so nah halten, dass er einen großen Teil des weißen Rahmens ausfüllt.
  </div>

  <div id="reader"></div>

  <div id="status">Kamera wird gestartet …</div>

  <button id="again" class="hidden">📷 Erneut scannen</button>

  <button id="close">Fenster schließen</button>

</main>

<script>
let scanner = null;
let scanning = false;
let scanGesendet = false;

const token =
  new URLSearchParams(location.search).get("token") || "";

const status =
  document.getElementById("status");

const again =
  document.getElementById("again");


function setStatus(text) {
  status.textContent = text;
}


async function stopScanner() {

  scanning = false;

  if (scanner) {

    try {
      await scanner.stop();
    } catch (e) {}

    try {
      scanner.clear();
    } catch (e) {}

    scanner = null;
  }
}


function sendResult(value) {

  if (scanGesendet) {
    return;
  }

  const text =
    String(value || "").trim();

  if (!text) {
    return;
  }

  scanGesendet = true;
  scanning = false;

  if (!window.opener || window.opener.closed) {

    setStatus("✓ QR-Code erkannt: " + text);

    again.classList.remove("hidden");

    scanGesendet = false;

    return;
  }

  window.opener.postMessage(
    {
      type: "DS_PRUEFSERVICE_QR_SCAN",
      value: text,
      token: token
    },
    "*"
  );

  setStatus(
    "✓ QR-Code erkannt – Arbeitsmittel wird geladen …"
  );

  setTimeout(function() {
    window.close();
  }, 500);
}


async function startScanner() {

  await stopScanner();

  scanGesendet = false;

  again.classList.add("hidden");

  if (typeof Html5Qrcode === "undefined") {

    setStatus(
      "QR-Scanner konnte nicht geladen werden."
    );

    again.classList.remove("hidden");

    return;
  }

  scanner =
    new Html5Qrcode(
      "reader",
      {
        verbose: false
      }
    );

  scanning = true;

  setStatus(
    "Kamera wird gestartet …"
  );

  /*
   * Wichtig:
   * Die Kamera wird ausdrücklich mit hoher Auflösung
   * und kontinuierlichem Autofokus angefordert.
   * Das hilft besonders bei kleinen QR-Etiketten.
   */
  const config = {

    fps: 15,

    aspectRatio: 1,

    disableFlip: true,

    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ],

    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    },

    videoConstraints: {
      facingMode: {
        ideal: "environment"
      },

      width: {
        ideal: 1920
      },

      height: {
        ideal: 1080
      },

      frameRate: {
        ideal: 30,
        max: 30
      },

      focusMode: "continuous"
    },

    qrbox: function(width, height) {

      /*
       * Etwas kleinerer Scanbereich:
       * Dadurch konzentriert sich die Erkennung
       * auf EINEN QR-Code statt auf mehrere Codes
       * auf einem Etikettenbogen.
       */
      const size =
        Math.floor(
          Math.min(width, height) * 0.62
        );

      return {
        width: Math.max(220, size),
        height: Math.max(220, size)
      };
    }
  };


  try {

    let cameras = [];

    try {
      cameras =
        await Html5Qrcode.getCameras();
    } catch (e) {
      cameras = [];
    }


    if (cameras.length > 0) {

      let kamera =
        cameras.find(function(camera) {

          const label =
            String(camera.label || "")
              .toLowerCase();

          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("rück") ||
            label.includes("haupt")
          );

        }) || cameras[0];


      /*
       * Wenn eine konkrete Kamera-ID vorhanden ist,
       * verwenden wir diese direkt.
       */
      await scanner.start(
        kamera.id,
        config,
        function(decodedText) {
          sendResult(decodedText);
        },
        function(errorMessage) {
          // Normale Nicht-Erkennung während des Scans.
        }
      );

    } else {

      await scanner.start(
        {
          facingMode: "environment"
        },
        config,
        function(decodedText) {
          sendResult(decodedText);
        },
        function(errorMessage) {
          // Normale Nicht-Erkennung während des Scans.
        }
      );
    }


    if (scanning) {

      setStatus(
        "✓ Kamera läuft – einen QR-Code nah vor die Kamera halten."
      );
    }

  } catch (e) {

    scanning = false;

    console.error(e);

    let message =
      "Kamera konnte nicht gestartet werden.";

    if (e && e.name === "NotAllowedError") {

      message =
        "Kamerazugriff wurde blockiert. Bitte die Kamera-Berechtigung für diese HTTPS-Seite erlauben.";
    }

    else if (e && e.name === "NotFoundError") {

      message =
        "Keine Kamera gefunden.";
    }

    else if (e && e.message) {

      message =
        "Kamera konnte nicht gestartet werden: " +
        e.message;
    }

    setStatus(message);

    again.classList.remove("hidden");
  }
}


again.onclick =
  function() {
    startScanner();
  };


document.getElementById("close").onclick =
  async function() {

    await stopScanner();

    window.close();
  };


window.addEventListener(
  "pagehide",
  function() {
    stopScanner();
  }
);


startScanner();
</script>

</body>
</html>
