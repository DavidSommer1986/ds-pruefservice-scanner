<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>QR-Code Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center}h1{font-size:22px;margin:18px 10px 8px}p{color:#ccc;margin:0 18px 14px;font-size:14px}.wrap{max-width:600px;margin:auto;padding:0 12px 24px}#videoWrap{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden}video{display:block;width:100%;height:auto;min-height:280px;object-fit:cover}#rahmen{position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.22)}#status{margin:14px 0;min-height:24px;font-weight:bold}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:bold;background:#fff;color:#111}.btn:disabled{opacity:.5}canvas{display:none}.small{font-size:12px;color:#999;margin-top:10px}</style>
</head>
<body>
<div class="wrap">
<h1>QR-Code scannen</h1>
<p>Halte den Arbeitsmittel-QR-Code in den markierten Bereich.</p>
<div id="videoWrap"><video id="video" playsinline muted autoplay></video><div id="rahmen"></div></div>
<canvas id="canvas"></canvas>
<div id="status">Kamera wird gestartet …</div>
<button class="btn" id="again" type="button" onclick="neuStarten()">Scanner neu starten</button>
<div class="small">Nach dem Erkennen wird die zugehörige Prüfseite direkt geöffnet.</div>
</div>
<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const statusEl=document.getElementById("status");
let stream=null;
let animationId=null;
let scanning=false;
let stableText="";
let stableCount=0;
let lastSeen=0;
let sending=false;
const REQUIRED_STABLE=4;
const LOST_AFTER=500;

function status(t){statusEl.textContent=t;}

async function startCamera(){
  stopCamera();
  scanning=false;sending=false;stableText="";stableCount=0;lastSeen=0;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status("Kamera wird von diesem Browser nicht unterstützt.");return;}
  try{
    status("Kamera wird gestartet …");
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1920,min:1280},height:{ideal:1080,min:720},frameRate:{ideal:30,max:30}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    scanning=true;
    status("Bereit – QR-Code vor die Kamera halten.");
    animationId=requestAnimationFrame(scanFrame);
  }catch(e){
    status("Kamera konnte nicht geöffnet werden. Bitte Kamerazugriff erlauben.");
  }
}

function stopCamera(){
  scanning=false;
  if(animationId)cancelAnimationFrame(animationId);
  animationId=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
}

function scanFrame(){
  if(!scanning||sending)return;
  if(video.readyState>=2&&video.videoWidth>0){
    const w=video.videoWidth;
    const h=video.videoHeight;
    canvas.width=w;canvas.height=h;
    ctx.drawImage(video,0,0,w,h);
    const image=ctx.getImageData(0,0,w,h);
    const code=jsQR(image.data,w,h,{inversionAttempts:"attemptBoth"});
    const now=Date.now();
    if(code&&code.data){
      const text=String(code.data).trim();
      if(text===stableText && now-lastSeen<=LOST_AFTER){
        stableCount++;
      }else{
        stableText=text;stableCount=1;
      }
      lastSeen=now;
      status("QR-Code erkannt … " + stableCount + "/" + REQUIRED_STABLE);
      if(stableCount>=REQUIRED_STABLE){
        sendResult(text);
        return;
      }
    }else if(now-lastSeen>LOST_AFTER){
      stableText="";stableCount=0;
      status("Bereit – QR-Code vor die Kamera halten.");
    }
  }
  animationId=requestAnimationFrame(scanFrame);
}

function sendResult(text){
  if(sending)return;
  sending=true;scanning=false;
  status("QR-Code erkannt – Prüfseite wird geöffnet …");
  stopCamera();
  try{
    const url=new URL(text,window.location.href);
    if(!url.searchParams.get("inventar")){
      url.searchParams.set("inventar",text);
    }
    if(window.opener&&!window.opener.closed){
      // Direkte Navigation des ursprünglichen Prüf-Tabs.
      // Dadurch gibt es keinen alten Scanwert und keinen postMessage-Zwischenschritt.
      window.opener.location.href=url.toString();
      window.close();
      setTimeout(()=>{status("Prüfseite wurde im ursprünglichen Tab geöffnet.");},500);
    }else{
      window.location.href=url.toString();
    }
  }catch(e){
    sending=false;
    status("QR-Code konnte nicht verarbeitet werden.");
  }
}

function neuStarten(){startCamera();}
window.addEventListener("pagehide",stopCamera);
window.addEventListener("beforeunload",stopCamera);
startCamera();
</script>
</body>
</html>
